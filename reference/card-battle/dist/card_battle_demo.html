<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カードバトル演出デモ</title>
<style>
/* ===== 盤面（cb-stage）=====
   大きさは親が決める。カードの大きさは盤面の幅から決まる（コンテナクエリ単位 cqw）。
   座標を使う演出レイヤーは position:fixed で画面座標に置くため、
   cb-stage の祖先に transform / filter を付けないこと。 */
.cb-stage{position:relative;overflow:hidden;container-type:size;--aimc:#ff6a3d;--t:.3s;
  touch-action:none;-webkit-tap-highlight-color:transparent;color:#eee;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  background:radial-gradient(ellipse 70% 55% at 50% 50%, #4a4a36 0%, #2e2c21 55%, #16140f 100%)}
.cb-stage *{box-sizing:border-box}
.cb-stage > *{--cw:clamp(56px,12.5cqw,112px);--ch:calc(var(--cw)*1.4)}
/* 揺れ（shake）はこの層だけにかける */
.cb-field{position:absolute;inset:0;display:grid;
  grid-template-rows: calc(var(--cw)*1.05 + 18px) 1fr 1fr calc(var(--cw)*.95) calc(var(--ch)*.78)}
/* 盤面の石床 */
.cb-board{position:absolute;left:4%;right:4%;top:calc(var(--cw)*1.05 + 18px);bottom:calc(var(--cw)*.95 + var(--ch)*.78);
  border-radius:28px;background:
    linear-gradient(180deg, rgba(0,0,0,.18), rgba(255,255,255,.03) 50%, rgba(0,0,0,.18)),
    repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 14px, rgba(0,0,0,.02) 14px 28px),
    #3c3a2c;
  box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 0 0 3px #5a4a32, 0 0 0 6px #2a2218;}
.cb-board::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,210,140,.35),transparent)}
.row{position:relative;display:flex;justify-content:center;align-items:center;
  gap:calc(var(--cw)*.12);z-index:1}
.heroArea{position:relative;display:flex;justify-content:center;align-items:center;z-index:1}
.heroArea.top{align-items:flex-end;padding-bottom:4px}

/* ---- カード ---- */
.card{position:relative;flex:none;width:var(--cw);height:var(--ch);
  border-radius:calc(var(--cw)*.09);
  border:calc(var(--cw)*.035) solid transparent;
  background:linear-gradient(#2c2636,#15121c) padding-box, var(--frame) border-box;
  box-shadow:0 4px 10px rgba(0,0,0,.55);user-select:none;-webkit-user-select:none;cursor:pointer}
.r-common{--frame:linear-gradient(135deg,#aeb6bf,#5b636c 50%,#c8d0d8)}
.r-rare{--frame:linear-gradient(135deg,#8cc6ff,#2553a8 50%,#b5dcff)}
.r-legendary{--frame:linear-gradient(135deg,#ffe28a,#a8721a 40%,#fff3c4 58%,#c8901f)}
.card .art{position:absolute;left:5%;right:5%;top:5%;height:55%;
  border-radius:8% 8% 45% 45% / 8% 8% 22% 22%;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%, hsl(var(--h) 75% 58%), hsl(var(--h) 60% 24%) 58%, hsl(var(--h) 50% 9%));
  box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.card .art svg{width:72%;height:72%}
.r-legendary .art{outline:2px solid rgba(255,215,120,.6);outline-offset:-2px}
.card .cost{position:absolute;left:-12%;top:-8%;width:32%;aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;font-weight:900;font-size:calc(var(--cw)*.17);
  background:radial-gradient(circle at 35% 30%,#a8d6ff,#1f5fbf 70%);border:2px solid #d8ecff;
  text-shadow:0 1px 2px #000;z-index:2}
.card .name{position:absolute;left:0;right:0;top:57%;padding:3% 2%;text-align:center;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:700;
  font-size:calc(var(--cw)*.1);color:#f3ead6;white-space:nowrap;overflow:hidden;
  background:linear-gradient(#56432e,#2b2118);border-top:1px solid #9b7d52;border-bottom:1px solid #9b7d52}
.card .tribe{position:absolute;left:0;right:0;top:77%;text-align:center;font-size:calc(var(--cw)*.075);color:#b9ad98}
.card .stat{position:absolute;bottom:-7%;width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:calc(var(--cw)*.18);color:#fff;
  text-shadow:0 0 2px #000,0 0 2px #000,0 1px 2px #000;z-index:2}
.card .atk{left:-9%;background:radial-gradient(circle at 35% 30%,#ffe7a0,#c7821b 70%);border:2px solid #fff0c8}
.card .hp{right:-9%;background:radial-gradient(circle at 35% 30%,#ffa698,#b3202a 70%);border:2px solid #ffd2cc}
.card .hp.damaged span{color:#ff6b6b}
.spell{--frame:linear-gradient(135deg,#d9b8ff,#5b2f9c 45%,#f0dcff 60%,#6a3bb0)}
.spell .art{border-radius:50%/42%;left:12%;right:12%;top:6%;height:50%}
.spell .name{top:56%;background:linear-gradient(#3e2a5c,#1f1530);border-color:#9c7cc9}
.spell .desc{position:absolute;left:6%;right:6%;top:74%;text-align:center;line-height:1.3;
  font-size:calc(var(--cw)*.078);color:#e2d6f5}
.cb-hand .card.picked{--lift:calc(var(--ch)*-.5);--s:1.22;z-index:40 !important;
  box-shadow:0 0 0 2px #fff,0 0 22px 8px hsla(var(--sh),100%,65%,.8)}
.valid{box-shadow:0 0 0 3px var(--aimc),0 0 18px 6px color-mix(in srgb,var(--aimc) 60%,transparent) !important}
.valid.hero{box-shadow:0 0 0 3px #3a2c16,0 0 0 6px var(--aimc),0 0 20px 8px color-mix(in srgb,var(--aimc) 60%,transparent) !important}
.cb-stage[data-aim=help]{--aimc:#5dff9a}
.row .card,.hero{transition:scale 150ms cubic-bezier(.2,0,0,1)}
.locked{scale:1.07}
/* ドラッグ */
.cb-drag{position:fixed;inset:0;z-index:58;pointer-events:none}
.cb-drag .card{position:absolute;left:0;top:0;transform-origin:50% 50%;
  box-shadow:0 22px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.15)}
.cb-drag .card.nope{box-shadow:0 0 0 3px #ff4a3a,0 22px 34px rgba(0,0,0,.55)}
.cb-drag .card.armed{box-shadow:0 0 0 3px #fff,0 0 30px 10px hsla(var(--sh),100%,65%,.9)}
.slot{flex:none;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.09);
  border:2px dashed rgba(255,230,160,.75);background:rgba(255,220,140,.08);box-shadow:inset 0 0 18px rgba(255,210,120,.25)}
.cb-board{transition:box-shadow 200ms ease}
.cb-stage.castzone .cb-board{box-shadow:inset 0 0 70px rgba(190,140,255,.45),0 0 0 3px #8a6ad0,0 0 0 6px #2a2218}
.cb-stage.dropzone .cb-board{box-shadow:inset 0 0 50px rgba(255,220,140,.25),0 0 0 3px #b8955a,0 0 0 6px #2a2218}
.cb-reticle{position:fixed;z-index:54;pointer-events:none;display:none}
.cb-reticle .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed var(--aimc);
  box-shadow:0 0 14px var(--aimc),inset 0 0 14px var(--aimc);animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cb-inspect{position:absolute;inset:0;z-index:66;display:none;place-items:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,.8))}
.cb-inspect .card{--cw:min(44vw,230px);--ch:calc(var(--cw)*1.4);cursor:default;box-shadow:0 24px 50px rgba(0,0,0,.7)}
.num.heal{-webkit-text-stroke:3px #0d5a2a;color:#eafff0}
.num.buff{-webkit-text-stroke:3px #6a4a08;color:#fff6d0;font-size:calc(var(--cw)*.3)}
.card .stat.buffed span{color:#8dff9a}
.card .flashov{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3}

/* 盤面上の状態 */
.row .card.ready{box-shadow:0 0 0 2px #7dff8a,0 0 14px 4px rgba(90,255,120,.5)}
.row .card.selected{box-shadow:0 0 0 3px #fff,0 0 22px 7px rgba(255,220,120,.85)}
.row .card.exhausted{filter:saturate(.55) brightness(.75)}
.row .card.charging{box-shadow:0 0 24px 10px rgba(255,120,40,.9)}
.aiming .row[data-side=enemy] .card:hover,.aiming .hero[data-side=enemy]:hover{box-shadow:0 0 0 3px #ff5a4a,0 0 20px 7px rgba(255,80,60,.75)}

/* ---- 手札 ---- */
.cb-hand{position:relative;z-index:5}
.cb-hand .card{position:absolute;left:0;top:calc(var(--ch)*.12);
  transform:translate(var(--x),calc(var(--y) + var(--lift,0px))) rotate(var(--r)) scale(var(--s,1));
  transform-origin:50% 120%;transition:transform var(--t) cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.cb-hand .card:hover{--lift:calc(var(--ch)*-.32);--s:1.18;z-index:30 !important}}

/* ---- リーダー ---- */
.hero{position:relative;width:calc(var(--cw)*.9);height:calc(var(--cw)*.9);border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 35%, var(--hc1), var(--hc2) 70%);
  border:3px solid #c9a55a;box-shadow:0 0 0 3px #3a2c16,0 6px 14px rgba(0,0,0,.6)}
.hero[data-side=enemy]{--hc1:#b64b4b;--hc2:#3a0f16}
.hero[data-side=player]{--hc1:#4b8ab6;--hc2:#0f213a}
.hero svg{position:absolute;inset:18%;width:64%;height:64%;opacity:.85}
.hero .hhp{position:absolute;right:-14%;bottom:-8%;min-width:44%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:calc(var(--cw)*.2);background:radial-gradient(circle at 35% 30%,#ffa698,#b3202a 70%);
  border:2px solid #ffd2cc;text-shadow:0 0 2px #000,0 1px 2px #000}
.hero .hname{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;
  font-size:calc(var(--cw)*.11);color:#d8cdb6;margin-top:2px}
.hero[data-side=enemy] .hname{top:auto;bottom:100%;margin:0 0 2px}

/* ---- オーバーレイ ---- */
.cb-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.35),rgba(0,0,0,.85));
  opacity:0;pointer-events:none;z-index:30;will-change:opacity}
.cb-flash{position:absolute;inset:0;background:#fff8e8;opacity:0;pointer-events:none;z-index:52;will-change:opacity;mix-blend-mode:screen}
.cracks{position:absolute;pointer-events:none;z-index:4;overflow:visible}
.shatter{position:fixed;z-index:45;pointer-events:none}
.shatter>*{position:absolute;left:0;top:0;margin:0}
.scorch{position:fixed;z-index:2;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(10,6,4,.75),rgba(30,15,8,.45) 55%,rgba(0,0,0,0))}
.cb-fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.cb-aim{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:55;overflow:visible}
.cb-aim path.line{fill:none;stroke:var(--aimc);stroke-width:9;stroke-linecap:round;stroke-dasharray:4 14;
  animation:dash .5s linear infinite;filter:drop-shadow(0 0 6px var(--aimc))}
@keyframes dash{to{stroke-dashoffset:-18}}
.num{position:fixed;z-index:60;pointer-events:none;font-weight:900;font-size:calc(var(--cw)*.42);
  color:#fff;-webkit-text-stroke:3px #7a0b0b;paint-order:stroke;text-shadow:0 4px 10px rgba(0,0,0,.6);
  transform:translate(-50%,-50%)}
.cb-banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:65;pointer-events:none;
  text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:900;
  font-size:clamp(28px,7vw,64px);letter-spacing:.12em;color:#fff4d6;
  text-shadow:0 0 18px rgba(255,190,90,.9),0 3px 0 #6a4a16;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.65) 20%,rgba(0,0,0,.65) 80%,transparent);padding:.35em 0}


.cb-cast{position:fixed;inset:0;z-index:42;pointer-events:none}
.cb-cast .card{position:absolute}
@media (prefers-reduced-motion:reduce){.cb-aim path.line{animation:none}.cb-hand .card{transition:none}}

/* デモページ専用の見た目（盤面の外側のボタン類） */
html,body{margin:0;height:100%;background:#15130f;overflow:hidden;touch-action:manipulation}
#game{position:fixed;inset:0}
#ui{position:absolute;left:8px;top:8px;z-index:70;display:flex;flex-direction:column;gap:6px;
  font-size:12px;background:rgba(20,16,10,.75);border:1px solid #5a4a32;border-radius:10px;padding:8px;max-width:190px}
#ui .btns{display:flex;flex-wrap:wrap;gap:5px}
#ui button{font:inherit;font-size:12px;color:#f3ead6;background:linear-gradient(#6a5436,#3d2f1e);
  border:1px solid #a88a5a;border-radius:6px;padding:5px 8px;cursor:pointer}
#ui button,#endTurn{transition:scale 150ms cubic-bezier(.2,0,0,1)}
#ui button:active,#endTurn:not(:disabled):active{scale:.96}
#ui label{display:flex;align-items:center;gap:6px;color:#cfc3aa}
#ui input[type=range]{width:90px}
#ui .hint{color:#a99e88;line-height:1.45;font-size:11px}
#endTurn{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:70;
  font:inherit;font-weight:800;font-size:13px;color:#1b1406;cursor:pointer;
  background:linear-gradient(#ffe08a,#d59a2a);border:2px solid #fff0c0;border-radius:999px;padding:9px 12px;
  box-shadow:0 0 12px rgba(255,200,90,.6)}
#endTurn:disabled{filter:grayscale(1) brightness(.6);cursor:default;box-shadow:none}
@media (max-width:600px){#ui{padding:5px;gap:4px;max-width:128px;left:4px;top:4px}#ui .hint{display:none}#ui input[type=range]{width:56px}#ui button{padding:4px 6px}#endTurn{right:4px;font-size:12px;padding:7px 9px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="ui">
  <div class="btns">
    <button id="bDraw">ドロー</button>
    <button id="bReset">リセット</button>
  </div>
  <label>速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="spv">1x</span></label>
  <div class="hint">手札を盤面へドラッグ → 召喚<br>緑に光るミニオンから相手へドラッグ → 攻撃<br>呪文は上へドラッグして対象で離す<br>長押し → カードを拡大<br>（タップ操作でも動きます）</div>
</div>
<button id="endTurn">ターン終了</button>

  function crackGeometry(w, h, P, n) {

    const rays_ = angs.map((a) => {
      const dx = Math.cos(a), dy = Math.sin(a);
      const t = Math.min(
        dx > 0 ? (w - P.x) / dx : dx < 0 ? -P.x / dx : Infinity,
        dy > 0 ? (h - P.y) / dy : dy < 0 ? -P.y / dy : Infinity

      const at = (f, j) => [P.x + dx * t * f - dy * j, P.y + dy * t * f + dx * j];
      return [[P.x, P.y], at(rand(0.28, 0.42), rand(-0.04, 0.04) * w), at(rand(0.6, 0.78), rand(-0.05, 0.05) * w), [P.x + dx * t, P.y + dy * t]];
    });
    const corners = [[0, 0], [w, 0], [w, h], [0, h]].map((c) => ({ c, r: rel(Math.atan2(c[1] - P.y, c[0] - P.x)) }));
    const polys = [];
    for (let i = 0; i < n; i++) {
      const A = rays_[i], B = rays_[(i + 1) % n], lo = angs[i] - ref, hi = i === n - 1 ? 2 * Math.PI : angs[i + 1] - ref;

      polys.push([A[0], A[1], B[1]]);
      polys.push([A[1], A[2], A[3], ...cs, B[3], B[2], B[1]]);
    }
    const lines = [...rays_, ...rays_.map((r, i) => [r[1], rays_[(i + 1) % n][1]])];

      el.classList.remove("nope", "armed");
      el._tilt = g.tilt;
      el._scale = g.scale;
      const lifted = { el, index: g.index, tilt: g.tilt, scale: g.scale };
      if (def.kind !== "spell") {
        if (inBoard && this.slot) {
          this.lifted = lifted;
          this.director.pendingSlot = this.slot;
          this.slot = null;
          this.cb.onPlayMinion(uid, g.slotIdx);
          return;
        }
        this.closeSlot();
      } else if (!g.targeted) {
        if (inBoard) {
          this.lifted = lifted;
          this.cb.onCast(uid, null);
          return;
        }
      } else {
        const t = !cancelled && g.holding && this.aim?.locked;
        this.endAim();
        if (t) {
          this.lifted = lifted;
          this.cb.onCast(uid, this.uid(t));
          return;
        }
      }
      el._drag = false;
      returnToHand(this.stage, el, g.index, lifted);
    }
    /* ---------------- 盤面の置き場所 ---------------- */
    cardsInRow() {
      return [...this.stage.rows.player.querySelectorAll(".card")];
    }
    slotIndexAt(x) {
      return this.cardsInRow().filter((c) => {
        const r = c.getBoundingClientRect();
        return x > r.left + r.width / 2;
      }).length;
    }
    openSlot(i) {
      if (this.slot && this.drag.slotIdx === i) return;
      const row = this.stage.rows.player, before = snapshot(row), fresh = !this.slot;
      if (fresh) {
        this.slot = document.createElement("div");
        this.slot.className = "slot";
      }
      row.insertBefore(this.slot, this.cardsInRow()[i] || null);
      this.drag.slotIdx = i;
      flip(row, before, this.slot);
      if (fresh) this.slot.animate([{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }], { duration: dur(180), easing: "ease-out" });
    }
    closeSlot() {
      if (!this.slot) return;
      const row = this.stage.rows.player, before = snapshot(row);
      this.slot.remove();
      this.slot = null;
      if (this.drag) this.drag.slotIdx = -1;
      flip(row, before);
    }
    /* ---------------- 長押しの拡大表示 ---------------- */
    showInspect(el) {
      const box = this.stage.inspect, c = el.cloneNode(true);
      c.className = c.className.replace(/\b(ready|selected|exhausted|picked|valid|locked|charging|nope|armed)\b/g, "");
      c.style.cssText = el.style.getPropertyValue("--sh") ? `--sh:${el.style.getPropertyValue("--sh")}` : "";
      c.querySelectorAll(".flashov,.cracks").forEach((n) => n.remove());
      box.replaceChildren(c);
      box.style.display = "grid";
      box.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur(160) });
      c.animate([{ transform: "scale(.6) translateY(30px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: dur(220), easing: "cubic-bezier(.2,.9,.3,1.1)" });
    }
    hideInspect() {
      const box = this.stage.inspect;
      box.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur(120) }).finished.then(() => {
        box.style.display = "none";
        box.replaceChildren();
      });
    }
  };
  function nope(el) {
    el.animate([{ translate: "0 0" }, { translate: "-6px 0" }, { translate: "6px 0" }, { translate: "0 0" }], { duration: 250 });
  }

  // src/game/cards.js
  var MINIONS = [
    { id: "beetle", name: "\u9EC4\u91D1\u306E\u7532\u866B", cost: 1, atk: 2, hp: 1, rarity: "common", hue: 45, tribe: "\u7363", sig: 4 },
    { id: "wolf", name: "\u7070\u71FC\u306E\u72FC", cost: 2, atk: 3, hp: 2, rarity: "common", hue: 18, tribe: "\u7363", sig: 3 },
    { id: "archer", name: "\u68EE\u306E\u5C04\u624B", cost: 2, atk: 2, hp: 3, rarity: "common", hue: 120, tribe: "\u30A8\u30EB\u30D5", sig: 6 },
    { id: "sentinel", name: "\u77F3\u58C1\u306E\u756A\u5175", cost: 3, atk: 1, hp: 6, rarity: "common", hue: 200, tribe: "\u30B4\u30FC\u30EC\u30E0", sig: 4 },
    { id: "swordsman", name: "\u84BC\u96F7\u306E\u5263\u58EB", cost: 4, atk: 4, hp: 3, rarity: "rare", hue: 215, tribe: "\u4EBA\u9593", sig: 5 },
    { id: "oracle", name: "\u661F\u8A60\u307F\u306E\u5DEB\u5973", cost: 5, atk: 3, hp: 5, rarity: "rare", hue: 285, tribe: "\u4EBA\u9593", sig: 8 },
    { id: "abyssKnight", name: "\u6DF1\u6DF5\u306E\u9A0E\u58EB", cost: 7, atk: 6, hp: 5, rarity: "legendary", hue: 265, tribe: "\u4E0D\u6B7B", sig: 7 },
    { id: "crimsonDragon", name: "\u7D05\u84EE\u306E\u53E4\u7ADC", cost: 8, atk: 7, hp: 7, rarity: "legendary", hue: 2, tribe: "\u30C9\u30E9\u30B4\u30F3", sig: 6 }
  ].map((d) => ({ kind: "minion", ...d }));
  var SPELLS = [
    { id: "fireball", effect: "fireball", name: "\u706B\u7403", cost: 4, hue: 18, sig: 3, rarity: "common", target: "enemy", value: 4, desc: "\u65751\u4F53\u306B4\u30C0\u30E1\u30FC\u30B8" },
    { id: "chain", effect: "chain", name: "\u96F7\u9CF4\u306E\u9023\u9396", cost: 5, hue: 205, sig: 5, rarity: "rare", target: "none", value: 2, desc: "\u6575\u30DF\u30CB\u30AA\u30F3\u5168\u4F53\u306B2\u30C0\u30E1\u30FC\u30B8" },
    { id: "heal", effect: "heal", name: "\u7652\u3057\u306E\u5149", cost: 2, hue: 110, sig: 8, rarity: "common", target: "ally", value: 5, desc: "\u5473\u65B91\u4F53\u306E\u4F53\u529B\u30925\u56DE\u5FA9" },
    { id: "buff", effect: "buff", name: "\u529B\u306E\u52A0\u8B77", cost: 3, hue: 45, sig: 4, rarity: "rare", target: "allyMinion", value: 2, desc: "\u5473\u65B9\u30DF\u30CB\u30AA\u30F31\u4F53\u306B+2/+2" }
  ].map((d) => ({ kind: "spell", ...d }));
  var ALL = new Map([...MINIONS, ...SPELLS].map((d) => [d.id, d]));
  var pickWith = (rng, list) => list[Math.floor(rng() * list.length)];
  function randomMinion(rng) {
    const x = rng(), rarity = x < 0.15 ? "legendary" : x < 0.45 ? "rare" : "common";
    return pickWith(rng, MINIONS.filter((d) => d.rarity === rarity));
  }
  function randomCard(rng) {
    return rng() < 0.3 ? pickWith(rng, SPELLS) : randomMinion(rng);
  }

  // src/game/rules.js
  var MAX_BOARD = 5;
  var MAX_HAND = 7;
  var HERO_HP = 20;
  var SIDES = ["player", "enemy"];
  var other = (side) => side === "player" ? "enemy" : "player";
  var heroUid = (side) => `hero:${side}`;
  var RuleError = class extends Error {
  };
  function createGame({ rng = Math.random, heroHp = HERO_HP } = {}) {
    const side = (name, s) => ({ hero: { uid: heroUid(s), name, hp: heroHp, maxHp: heroHp }, board: [], hand: [] });
    return {
      rng,
      nextId: 1,
      turn: "player",
      over: false,
      winner: null,
      sides: { player: side("\u3042\u306A\u305F", "player"), enemy: side("\u6575\u30EA\u30FC\u30C0\u30FC", "enemy") }
    };
  }
  var newUid = (state2) => `c${state2.nextId++}`;
  function findEntity(state2, uid) {
    for (const s of SIDES) {
      const sd = state2.sides[s];
      if (sd.hero.uid === uid) return { entity: sd.hero, side: s, hero: true };
      const unit = sd.board.find((u) => u.uid === uid);
      if (unit) return { entity: unit, side: s, hero: false };
    }
    return null;
  }
  var boardFull = (state2, side) => state2.sides[side].board.length >= MAX_BOARD;
  function canAttack(state2, uid) {
    const f = findEntity(state2, uid);
    return !!f && !f.hero && !state2.over && f.side === state2.turn && !f.entity.exhausted && f.entity.atk > 0;
  }
  function attackTargets(state2, uid) {
    const f = findEntity(state2, uid);
    if (!f || f.hero) return [];
    const foe = state2.sides[other(f.side)];
    return [...foe.board.map((u) => u.uid), foe.hero.uid];
  }
  function spellTargets(state2, side, def) {
    const me = state2.sides[side], foe = state2.sides[other(side)];
    const units = (sd) => sd.board.map((u) => u.uid);
    if (def.target === "enemy") return [...units(foe), foe.hero.uid];
    if (def.target === "ally") return [...units(me), me.hero.uid];
    if (def.target === "allyMinion") return units(me);
    return [];
  }
  function canCast(state2, side, def) {
    return def.target === "none" || spellTargets(state2, side, def).length > 0;
  }
  var handCard = (state2, side, uid) => {
    const i = state2.sides[side].hand.findIndex((c) => c.uid === uid);
    if (i < 0) throw new RuleError("\u624B\u672D\u306B\u306A\u3044\u30AB\u30FC\u30C9\u3067\u3059");
    return i;
  };
  var assertTurn = (state2, side) => {
    if (state2.over) throw new RuleError("\u30B2\u30FC\u30E0\u306F\u7D42\u4E86\u3057\u3066\u3044\u307E\u3059");
    if (state2.turn !== side) throw new RuleError("\u76F8\u624B\u306E\u30BF\u30FC\u30F3\u3067\u3059");
  };
  function drawCard(state2, side, def = randomCard(state2.rng)) {
    const hand = state2.sides[side].hand;
    if (hand.length >= MAX_HAND) return [];
    const card = { uid: newUid(state2), def };
    hand.push(card);
    return [{ type: "draw", side, card: { ...card } }];
  }
  function playMinion(state2, side, source, index = null) {
    assertTurn(state2, side);
    if (boardFull(state2, side)) throw new RuleError("\u76E4\u9762\u304C\u3044\u3063\u3071\u3044\u3067\u3059");
    let def, uid, fromHand = null;
    if (source.uid) {
      const hand = state2.sides[side].hand, i = handCard(state2, side, source.uid);
      ({ def, uid } = hand[i]);
      if (def.kind !== "minion") throw new RuleError("\u30DF\u30CB\u30AA\u30F3\u3067\u306F\u3042\u308A\u307E\u305B\u3093");
      hand.splice(i, 1);
      fromHand = uid;
    } else {
      def = source.def;
      uid = newUid(state2);
    }
    const board = state2.sides[side].board;
    const at = index == null ? board.length : Math.max(0, Math.min(index, board.length));
    const unit = { uid, def, side, atk: def.atk, hp: def.hp, maxHp: def.hp, exhausted: false };
    board.splice(at, 0, unit);
    return [{ type: "summon", side, unit: { ...unit }, index: at, fromHand }];
  }
  function attack(state2, attackerUid, targetUid) {
    const a = findEntity(state2, attackerUid);
    if (!a) throw new RuleError("\u653B\u6483\u3059\u308B\u30DF\u30CB\u30AA\u30F3\u304C\u3044\u307E\u305B\u3093");
    assertTurn(state2, a.side);
    if (!canAttack(state2, attackerUid)) throw new RuleError("\u3053\u306E\u30DF\u30CB\u30AA\u30F3\u306F\u653B\u6483\u3067\u304D\u307E\u305B\u3093");
    if (!attackTargets(state2, attackerUid).includes(targetUid)) throw new RuleError("\u305D\u306E\u5BFE\u8C61\u306F\u653B\u6483\u3067\u304D\u307E\u305B\u3093");
    const t = findEntity(state2, targetUid), att = a.entity, tgt = t.entity;
    att.exhausted = true;
    const hits = [damage(tgt, att.atk)];
    if (!t.hero && tgt.atk > 0) hits.push(damage(att, tgt.atk));
    return [{ type: "attack", attacker: att.uid, target: tgt.uid, power: att.atk, hits }, ...resolveDeaths(state2)];
  }
  function damage(entity, amount) {
    entity.hp -= amount;
    return { uid: entity.uid, amount, hp: entity.hp, maxHp: entity.maxHp };
  }
  function castSpell(state2, side, source, targetUid = null) {
    assertTurn(state2, side);
    let def, fromHand = null;
    if (source.uid) {
      const hand = state2.sides[side].hand, i = handCard(state2, side, source.uid);
      def = hand[i].def;
      if (def.kind !== "spell") throw new RuleError("\u546A\u6587\u3067\u306F\u3042\u308A\u307E\u305B\u3093");
      if (def.target !== "none" && !spellTargets(state2, side, def).includes(targetUid)) throw new RuleError("\u305D\u306E\u5BFE\u8C61\u306F\u9078\u3079\u307E\u305B\u3093");
      hand.splice(i, 1);
      fromHand = source.uid;
    } else {
      def = source.def;
    }
    const foe = state2.sides[other(side)];
    let results;
    switch (def.effect) {
      case "fireball":
        results = [{ kind: "damage", ...damage(findEntity(state2, targetUid).entity, def.value) }];
        break;
      case "chain": {
        const victims = foe.board.length ? [...foe.board] : [foe.hero];
        results = victims.map((v) => ({ kind: "damage", ...damage(v, def.value) }));
        break;
      }
      case "heal": {
        const e = findEntity(state2, targetUid).entity, before = e.hp;
        e.hp = Math.min(e.maxHp, e.hp + def.value);
        results = [{ kind: "heal", uid: e.uid, amount: e.hp - before, hp: e.hp, maxHp: e.maxHp }];
        break;
      }
      case "buff": {
        const e = findEntity(state2, targetUid).entity;
        e.atk += def.value;
        e.hp += def.value;
        e.maxHp += def.value;
        results = [{ kind: "buff", uid: e.uid, value: def.value, atk: e.atk, hp: e.hp, maxHp: e.maxHp }];
        break;
      }
      default:
        throw new RuleError(`\u672A\u5B9F\u88C5\u306E\u546A\u6587: ${def.effect}`);
    }
    return [{ type: "spell", side, def, fromHand, targets: results.map((r) => r.uid), results }, ...resolveDeaths(state2)];
  }
  function resolveDeaths(state2) {
    const events = [];
    for (const s of SIDES) {
      const sd = state2.sides[s];
      for (const u of sd.board.filter((x) => x.hp <= 0)) events.push({ type: "death", uid: u.uid, side: s });
      sd.board = sd.board.filter((x) => x.hp > 0);
    }
    const fallen = SIDES.filter((s) => state2.sides[s].hero.hp <= 0);
    if (fallen.length && !state2.over) {
      fallen.forEach((s) => events.push({ type: "death", uid: heroUid(s), side: s, hero: true }));
      state2.over = true;
      state2.winner = fallen.length === 2 ? null : other(fallen[0]);
      events.push({ type: "gameOver", winner: state2.winner });
    }
    return events;
  }
  function endTurn(state2) {
    if (state2.over) throw new RuleError("\u30B2\u30FC\u30E0\u306F\u7D42\u4E86\u3057\u3066\u3044\u307E\u3059");
    state2.turn = other(state2.turn);
    state2.sides[state2.turn].board.forEach((u) => {
      u.exhausted = false;
    });
    const events = [{ type: "turn", side: state2.turn }];
    if (state2.turn === "player") events.push(...drawCard(state2, "player"));
    return events;
  }

  // src/game/ai.js
  var pickWith2 = (rng, list) => list[Math.floor(rng() * list.length)];
  var spell = (id) => SPELLS.find((s) => s.id === id);
  function runEnemyTurn(state2) {
    const { rng } = state2, me = state2.sides.enemy, foe = state2.sides.player;
    const events = [];
    if (me.board.length < 4) events.push(...playMinion(state2, "enemy", { def: randomMinion(rng) }));
    if (!state2.over && rng() < 0.6) {
      const def = foe.board.length >= 2 && rng() < 0.5 ? spell("chain") : spell("fireball");
      if (canCast(state2, "enemy", def)) {
        const target = def.target === "none" ? null : pickWith2(rng, spellTargets(state2, "enemy", def));
        events.push(...castSpell(state2, "enemy", { def }, target));
      }
    }
    for (const unit of [...me.board]) {
      if (state2.over) break;
      if (!canAttack(state2, unit.uid)) continue;
      const target = rng() < 0.35 || !foe.board.length ? foe.hero.uid : pickWith2(rng, foe.board).uid;
      events.push(...attack(state2, unit.uid, target));
    }
    return events;
  }

  // src/main.js
  var $ = (sel) => document.querySelector(sel);
  var stage = createStage($("#game"));
  var director = new Director(stage);
  var endTurnBtn = $("#endTurn");
  var state = null;
  var busy = false;
  var handDef = (uid) => state.sides.player.hand.find((c) => c.uid === uid)?.def;
  var input = new Input(stage, director, {
    canAct: () => !busy && !state.over && state.turn === "player",
    canAttack: (uid) => canAttack(state, uid),
    attackTargets: (uid) => attackTargets(state, uid),
    spellTargets: (uid) => spellTargets(state, "player", handDef(uid)),
    boardFull: () => boardFull(state, "player")
  }, {
    onPlayMinion: (uid, index) => act(() => playMinion(state, "player", { uid }, index)),
    onAttack: (att, tgt) => act(() => attack(state, att, tgt)),
    onCast: (uid, target) => act(() => castSpell(state, "player", { uid }, target))
  });
  async function act(rule) {
    if (busy || state.over) return;
    let events;
    try {
      events = rule();
    } catch (err) {
      if (!(err instanceof RuleError)) throw err;
      input.restore();
      console.info(err.message);
      return;
    }
    input.settle();
    busy = true;
    endTurnBtn.disabled = true;
    try {
      await director.play(events);
    } finally {
      director.sync(state);
      busy = false;
      endTurnBtn.disabled = state.over;
    }
  }
  function newGame() {
    input.reset();
    state = createGame();
    const pick2 = (list) => list[Math.floor(Math.random() * list.length)];
    const commons = MINIONS.filter((d) => d.rarity !== "legendary");
    for (let i = 0; i < 3; i++) {
      const def = pick2(commons);
      state.sides.enemy.board.push({ uid: `e${i}`, def, side: "enemy", atk: def.atk, hp: def.hp, maxHp: def.hp, exhausted: false });
    }
    director.mount(state);
    busy = false;
    endTurnBtn.disabled = false;
    const byId = (id) => [...MINIONS, ...SPELLS].find((d) => d.id === id);
    const opening = [pick2(commons), byId("swordsman"), pick2(MINIONS.filter((d) => d.rarity === "legendary")), byId("fireball"), byId("chain"), byId("buff")];
    act(() => opening.flatMap((def) => drawCard(state, "player", def)));
  }
  endTurnBtn.addEventListener("click", () => {
    input.reset();
    act(() => {
      const events = [...endTurn(state), ...runEnemyTurn(state)];
      if (!state.over) events.push(...endTurn(state));
      return events;
    });
  });
  $("#bDraw").addEventListener("click", () => act(() => drawCard(state, "player")));
  $("#bReset").addEventListener("click", newGame);
  $("#speed").addEventListener("input", (e) => {
    setSpeed(+e.target.value);
    $("#spv").textContent = e.target.value + "x";
  });
  newGame();
})();
</script>
</body>
</html>
