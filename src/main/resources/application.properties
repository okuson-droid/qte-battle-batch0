spring.application.name=qte-battle
# クラウド実行環境(Render等)は環境変数PORTで待受ポートを指定してくる。
# 指定がなければローカル開発用の8080を使う
server.port=${PORT:8080}
# ゲーム状態はメモリ上に保持するためDB設定は存在しない(batch0-design-notes.md 1章参照)

# ---------------------------------------------------------------------------
# 手動モード(Batch 23 設計書 5-2)
# ---------------------------------------------------------------------------
# 後攻へ配る【ピュア・エレメント】の手動モードカードID。
# ★カードIDを Java にリテラルで書かないための設定である(ハンドオフ3章の原則)。
#   名前(「ピュア・エレメント」)での台帳検索を採らなかったのは、名前をリテラルで書くのは
#   IDを書くのと本質的に同じだからである。設定に出せば、台帳のIDが変わってもコードは変わらない。
# ★空にする / 存在しないIDを書いても起動は失敗しない。配布だけがスキップされ、
#   起動ログに警告が出る。一人回しでは無くても困らない機能であり、設定漏れで
#   アプリ全体が上がらなくなるほうが害が大きい。
qte.manual.pure-element-id=QTE-M-NONE-01

# ---------------------------------------------------------------------------
# エラーページ(Batch 33 設計解説 2-5)
# ---------------------------------------------------------------------------
# templates/error.html が Whitelabel Error Page を置き換える(Java の変更は無い)。
# ★例外メッセージとスタックトレースは画面に出さない。既定値と同じだが、
#   「出さないことを決めた」ことをここに残す。エラーページは外から一番よく見える
#   場所であり、内部構造が漏れる経路になりやすい。
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# 公開URL(Batch 34 設計解説 4章・裁定24)
# ---------------------------------------------------------------------------
# OGP画像(og:image)の絶対URLを組み立てるための基点。
# ★og:image は絶対URLでなければならない(相対URLの解決はクローラ依存である・裁定22)。
#   その絶対URLはホスティング先に依存する値なので、テンプレートではなくここに置く。
#   qte.manual.pure-element-id と同じ「環境依存の値は設定へ」の系列である。
# ★末尾のスラッシュは有無どちらでもよい(PublicUrlAdvice が吸収する)。
# ★空にしても起動は失敗しない。og:image のタグが消えるだけである。
#   相対URLへ退化させないための判断であり、詳細は PublicUrlAdvice の javadoc に書いた。
qte.public-base-url=https://qte-battle-batch0.onrender.com
