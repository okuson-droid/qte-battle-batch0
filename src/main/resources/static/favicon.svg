<?xml version="1.0" encoding="UTF-8"?>
<!--
  Batch 33: アプリのアイコン。
  ★盤面と同じ暗色(#212529)を地にし、カードを3枚扇状に重ねた形にしてある。
    色は FACE_CIV_COLORS(manual-battle.js)の水・闇・火をそのまま使う。
  ★16px でも「カードが重なっている」輪郭だけは残るよう、枚数を3枚に抑え、
    縁を太い明色にして輪郭を立てている。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#212529"/>
  <g stroke="#f8f9fa" stroke-width="2.5" stroke-linejoin="round">
    <rect x="11" y="22" width="20" height="28" rx="3" fill="#2f6fb5"
          transform="rotate(-20 21 36)"/>
    <rect x="33" y="22" width="20" height="28" rx="3" fill="#b53a3a"
          transform="rotate(20 43 36)"/>
    <rect x="22" y="15" width="20" height="29" rx="3" fill="#6b42a8"/>
  </g>
</svg>
