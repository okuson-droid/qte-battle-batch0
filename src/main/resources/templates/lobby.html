<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ロビー(通常対戦) — クイン・タブーエレメント</title>
    <!-- ★Batch 33 2-3: アイコンとメタ情報。favicon が無いと全ページで
         ブラウザ既定アイコン+毎ロード404になる。theme-color と description は
         リンクを貼った先・ブックマーク・検索結果での見え方に効く -->
    <meta name="description" content="通常対戦モードのロビー。カード効果の判定をアプリが行うモードです(未完成)。">
    <meta name="theme-color" content="#212529">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <!-- ★Batch 41: CDN をやめて自前配信にした(理由は batch41 設計解説 1章) -->
    <link th:href="@{/vendor/bootstrap-5.3.3.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 760px">
    <h1 class="mb-1">クイン・タブーエレメント</h1>
    <p class="text-muted mb-3">
        部屋を作って、表示された部屋コードを対戦相手に伝えてください。
        <!--/* ★Batch 63: デッキを組む場所は両モード共通のデッキメーカー1つになった
                (通常モード専用のデッキビルダー /deck-builder は退役)。
                ★これは Thymeleaf のパーサ水準コメントであり、配信されるHTMLには残らない ——
                素のHTMLコメントで書くと退役した経路の文字列がページに出てしまい、
                「リンクが残っていない」を測る試験を黙らせる(裁定114 と同じ形)。 */-->
        <a th:href="@{/deck-maker}">デッキメーカー</a> /
        <a th:href="@{/cards}">カード一覧</a> /
        <a th:href="@{/}">手動モード</a>
    </p>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="card mb-4">
        <div class="card-header"><strong>部屋を作る(プレイヤー1)</strong></div>
        <div class="card-body">
            <form th:action="@{/rooms}" method="post" class="row g-3" onsubmit="return prepareDeck(this)">
                <div class="col-md-6">
                    <label class="form-label">プレイヤー名</label>
                    <input type="text" name="playerName" class="form-control" placeholder="例: オクソン">
                </div>
                <div class="col-md-6">
                    <label class="form-label">リーダー(デッキ未読込のとき)</label>
                    <select name="leaderCardId" class="form-select">
                        <option th:each="leader : ${leaders}" th:value="${leader.id}"
                                th:text="${leader.civilization.displayName} + ' / ' + ${leader.name}">リーダー</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">デッキファイル(任意)</label>
                    <input type="file" class="form-control" accept=".json" onchange="readDeck(this)">
                    <div class="form-text deck-status">未選択の場合はプリセットデッキ(おまかせ)で対戦します</div>
                    <input type="hidden" name="deckJson">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">部屋を作成して入室</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><strong>部屋に入る(プレイヤー2)</strong></div>
        <div class="card-body">
            <form th:action="@{/rooms/join}" method="post" class="row g-3" onsubmit="return prepareDeck(this)">
                <div class="col-md-4">
                    <label class="form-label">部屋コード</label>
                    <input type="text" name="roomId" class="form-control text-uppercase" placeholder="ABC123" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">プレイヤー名</label>
                    <input type="text" name="playerName" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">リーダー(デッキ未読込のとき)</label>
                    <select name="leaderCardId" class="form-select">
                        <option th:each="leader : ${leaders}" th:value="${leader.id}"
                                th:text="${leader.civilization.displayName} + ' / ' + ${leader.name}">リーダー</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">デッキファイル(任意)</label>
                    <input type="file" class="form-control" accept=".json" onchange="readDeck(this)">
                    <div class="form-text deck-status">未選択の場合はプリセットデッキ(おまかせ)で対戦します</div>
                    <input type="hidden" name="deckJson">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">入室する</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // デッキファイルはブラウザ側で読み取り、隠しフィールドに載せて通常のフォーム送信で届ける。
    // 中身の正当性はサーバのDeckValidatorが判定する(ここでの確認は表示のためだけ)。

    /**
     * ★★Batch 63: デッキファイルの要約。欄の名前はデッキメーカーが書く形式
     * (taboo-elemental-deck v2)に揃えてある。62 まではここが count / name を見ており、
     * デッキメーカーで組んだデッキを選ぶと「メインNaN枚」と表示されたまま送信され、
     * サーバに弾かれていた —— 通常モードで読み込めなかった事象の、画面側の顔である。
     *
     * ★機械検証(verify 63)はこの関数を取り出して、デッキメーカーの<b>実際の書き出し</b>に
     * 当てる。だから名前付きの関数として切り出してある(その場に書くと取り出せない)。
     */
    function deckSummary(deck) {
        if (!deck || deck.format !== 'taboo-elemental-deck') {
            return null;
        }
        const main = (deck.main || []).reduce((sum, e) => sum + (e.qty || 1), 0);
        return { name: deck.deckName || '(名前なし)', main: main, taboo: (deck.taboo || []).length };
    }

    function readDeck(input) {
        const form = input.closest('form');
        const status = form.querySelector('.deck-status');
        const hidden = form.querySelector('input[name="deckJson"]');
        const file = input.files[0];
        if (!file) {
            hidden.value = '';
            status.textContent = '未選択の場合はプリセットデッキ(おまかせ)で対戦します';
            return;
        }
        const reader = new FileReader();
        reader.onload = () => {
            hidden.value = reader.result;
            try {
                const summary = deckSummary(JSON.parse(reader.result));
                status.textContent = summary === null
                    ? 'デッキメーカーで保存したデッキファイルを選んでください'
                    : `読み込み: ${summary.name} / メイン${summary.main}枚・禁忌${summary.taboo}枚`;
            } catch (e) {
                status.textContent = 'このファイルはJSONとして読めません';
            }
        };
        reader.readAsText(file);
    }

    function prepareDeck(form) {
        return true; // ファイル読み込みはonchangeで完了している
    }
</script>
</body>
</html>
