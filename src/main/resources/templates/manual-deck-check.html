<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QTE Battle - 手動モード デッキ取り込み確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 目視確認のためだけの画面なので、CSSはここに閉じる(battle.css を汚さない)。 */
        .zone-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: .5rem;
        }
        .zone-cell img {
            width: 100%;
            aspect-ratio: 5 / 7;
            object-fit: contain;
            background: #e9ecef;
            border-radius: .25rem;
        }
        .zone-cell .cap {
            font-size: .68rem;
            line-height: 1.25;
            word-break: break-all;
        }
        .zone-cell.unresolved img {
            background: #b4b2a9;
        }
        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .75rem;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">

    <h1 class="h4 mb-1">手動モード デッキ取り込み確認</h1>
    <p class="text-muted small mb-4">
        Batch 17b の目視確認専用の画面である。部屋を1つ作り、席Aにデッキ zip を読み込んで、
        49枚すべてがカード定義に解決することを確かめる。盤面そのものは Batch 18b で作る。
    </p>

    <div class="card mb-4">
        <div class="card-body">
            <label for="deckZip" class="form-label">デッキ zip(main.xml と kinki.xml を含むもの)</label>
            <input class="form-control" type="file" id="deckZip" accept=".zip">
            <div class="form-text">
                ファイルを選ぶと、部屋の作成 → 入室 → 席Aへの読み込みまでを続けて実行する。
            </div>
        </div>
    </div>

    <div id="status" class="alert alert-secondary d-none"></div>

    <div id="result" class="d-none">
        <div class="card mb-3">
            <div class="card-body">
                <table class="table table-sm mb-0">
                    <tbody>
                    <tr><th class="w-25">部屋ID</th><td class="mono" id="rRoom"></td></tr>
                    <tr><th>デッキ名</th><td id="rDeckName"></td></tr>
                    <tr><th>リーダー</th><td id="rLeader"></td></tr>
                    <tr><th>枚数</th><td id="rCounts"></td></tr>
                    <tr><th>未解決</th><td id="rUnresolved"></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="warningBox" class="alert alert-warning d-none">
            <strong>警告</strong>
            <ul class="mb-0 small" id="rWarnings"></ul>
        </div>
        <div id="okBox" class="alert alert-success d-none">
            警告なし。49枚すべてがカード定義に解決した。
        </div>

        <h2 class="h6 mt-4">手札 <span class="text-muted small" id="handCount"></span></h2>
        <div class="zone-grid mb-4" id="handZone"></div>

        <h2 class="h6">禁忌 <span class="text-muted small" id="tabooCount"></span></h2>
        <div class="zone-grid mb-4" id="tabooZone"></div>

        <h2 class="h6">山札 <span class="text-muted small" id="deckCount"></span></h2>
        <div class="zone-grid mb-4" id="deckZone"></div>
    </div>
</div>

<script>
    // 画像URLの組み立てはこの1関数に閉じる(設計書 3-4)。
    // 縮小版や WebP を入れる場合もここだけを直す。
    function cardImageUrl(imageId) {
        return '/cards/' + imageId + '.png';
    }

    function setStatus(text, kind) {
        const box = document.getElementById('status');
        box.className = 'alert alert-' + kind;
        box.textContent = text;
    }

    function renderZone(containerId, cards, countId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        document.getElementById(countId).textContent = '(' + cards.length + '枚)';
        for (const card of cards) {
            const cell = document.createElement('div');
            cell.className = 'zone-cell' + (card.cardId ? '' : ' unresolved');
            const img = document.createElement('img');
            if (card.imageId) {
                img.src = cardImageUrl(card.imageId);
                img.loading = 'lazy';
            }
            const cap = document.createElement('div');
            cap.className = 'cap';
            cap.textContent = card.name;
            cell.appendChild(img);
            cell.appendChild(cap);
            container.appendChild(cell);
        }
    }

    async function postJson(url, body) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.message || ('HTTP ' + response.status));
        }
        return data;
    }

    async function runImport(file) {
        setStatus('部屋を作成している…', 'secondary');
        const joined = await postJson('/manual/api/rooms', {displayName: '確認用'});

        setStatus('デッキを読み込んでいる…', 'secondary');
        const url = '/manual/api/rooms/' + joined.roomId
            + '/deck?seat=A&occupantId=' + encodeURIComponent(joined.occupantId);
        const response = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/octet-stream'},
            body: file
        });
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.message || ('HTTP ' + response.status));
        }
        return result;
    }

    function render(result) {
        document.getElementById('rRoom').textContent = result.roomId;
        document.getElementById('rDeckName').textContent = result.deckName || '(名称なし)';
        document.getElementById('rLeader').textContent = result.leaderName || '(見つからなかった)';
        document.getElementById('rCounts').textContent =
            'リーダー込み ' + result.totalCards + '枚 / メイン ' + result.mainCount
            + '枚 / 禁忌 ' + result.tabooCount + '枚';
        document.getElementById('rUnresolved').textContent = result.unresolvedCount + '枚';

        const warningBox = document.getElementById('warningBox');
        const okBox = document.getElementById('okBox');
        const list = document.getElementById('rWarnings');
        list.innerHTML = '';
        if (result.warnings.length > 0) {
            for (const warning of result.warnings) {
                const li = document.createElement('li');
                li.textContent = warning;
                list.appendChild(li);
            }
            warningBox.classList.remove('d-none');
            okBox.classList.add('d-none');
        } else {
            warningBox.classList.add('d-none');
            okBox.classList.remove('d-none');
        }

        const seat = result.view.seatA;
        renderZone('handZone', seat.zones.HAND, 'handCount');
        renderZone('tabooZone', seat.zones.TABOO, 'tabooCount');
        renderZone('deckZone', seat.zones.DECK, 'deckCount');
        document.getElementById('result').classList.remove('d-none');
    }

    document.getElementById('deckZip').addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) {
            return;
        }
        document.getElementById('result').classList.add('d-none');
        try {
            const result = await runImport(file);
            render(result);
            setStatus('読み込みが完了した。', 'success');
        } catch (error) {
            setStatus('失敗した: ' + error.message, 'danger');
        }
    });
</script>
</body>
</html>
