<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>対戦(通常モード) — クイン・タブーエレメント</title>
    <!-- ★Batch 33 2-3: アイコンとメタ情報。favicon が無いと全ページで
         ブラウザ既定アイコン+毎ロード404になる。theme-color と description は
         リンクを貼った先・ブックマーク・検索結果での見え方に効く -->
    <meta name="description" content="通常対戦モードの盤面。カード効果の判定をアプリが行うモードです(未完成)。">
    <meta name="theme-color" content="#212529">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <!-- ★Batch 41: CDN をやめて自前配信にした(理由は batch41 設計解説 1章) -->
    <link th:href="@{/vendor/bootstrap-5.3.3.min.css}" rel="stylesheet">
    <link th:href="@{/css/battle.css(v=44)}" rel="stylesheet">
</head>
<body class="bg-dark text-light">
<!-- ★★Batch 43: 1画面レイアウト(設計解説 1章)。
     手動モードと同じ「中央列(可変)+ 右列(400px固定)」の骨格に組み替えた。
     ★目標は 1280×800 で縦スクロールなし。verify が番人である。
     ★要素の id は 42 以前から1つも変えていない。動いたのは<b>置き場所</b>だけで、
       battle.js の描画・状態ロジックはこの組み替えを知らない。 -->
<div class="auto-root" id="auto-root">

    <!-- ヘッダ(1行) -->
    <div class="auto-header">
        <span>部屋 <strong id="room-code" class="text-warning" th:text="${roomId}">------</strong></span>
        <span class="text-muted small" id="connection-status">接続中...</span>
        <span class="auto-header-spacer"></span>
        <button id="btn-auto-mode" class="btn btn-sm btn-outline-light"
                onclick="toggleAutoMode()">進行: 手動</button>
        <span id="phase-indicator" class="fs-5"></span>
    </div>

    <div class="auto-columns">
        <!-- 中央列 -->
        <div class="auto-main">

            <!-- 相手の帯。★38 までの「文字列の羅列」をチップ列に畳んだ(設計解説 2-2)。
                 数字の span の id は従来のまま(battle.js は置き場所を知らない) -->
            <!-- ★Batch 44(案1・マスター承認): リーダー合体タイル + パイル + 手札の裏面列。
                 相手のマナはチップのまま(非対称。手動モードの「相手上段は簡略」と同じ判断) -->
            <div class="auto-strip opponent-side">
                <div id="opp-leader" class="leader-card auto-leader">
                    <div class="auto-leader-name" id="opp-leader-name">?</div>
                    <div class="auto-leader-lp" id="opp-lp">-</div>
                    <div class="auto-leader-ability" id="opp-leader-ability">&nbsp;</div>
                    <div class="auto-leader-weapon">⚔ <span id="opp-weapon">なし</span></div>
                </div>
                <div id="opp-piles" class="auto-piles"></div>
                <div class="auto-strip-info">
                    <div class="auto-chip-row">
                        <span class="auto-chip">手札</span>
                        <div id="opp-hand-backs" class="auto-backs"></div>
                        <span class="auto-chip d-none">手札 <b id="opp-hand-count">-</b></span>
                        <span class="auto-chip">MP <b id="opp-mp">-</b></span>
                        <a href="#" class="auto-chip auto-chip-link"
                           onclick="showManaList(false); return false;">マナ <b id="opp-mana-count">-</b></a>
                        <span class="auto-chip auto-chip-plain text-muted" id="opp-deck-name">-</span>
                    </div>
                    <div id="opp-mana-row" class="mana-row"></div>
                </div>
            </div>

            <div id="opp-minions" class="minion-row auto-minions"></div>
            <div id="my-minions" class="minion-row auto-minions"></div>

            <!-- 自分の帯 -->
            <div class="auto-strip my-side">
                <div id="my-leader" class="leader-card auto-leader">
                    <div class="auto-leader-name" id="my-leader-name">?</div>
                    <div class="auto-leader-lp" id="my-lp">-</div>
                    <div class="auto-leader-ability" id="my-leader-ability">&nbsp;</div>
                    <div class="auto-leader-weapon">⚔ <span id="my-weapon">なし</span></div>
                </div>
                <div id="my-piles" class="auto-piles"></div>
                <div class="auto-strip-info">
                    <div class="auto-chip-row">
                        <span class="auto-chip">MP <b id="my-mp">-</b> / マナ <b id="my-mana-count">-</b></span>
                        <button id="btn-leader-ability" class="btn btn-sm btn-outline-info d-none"
                                onclick="useLeaderAbility()">リーダー能力を使う</button>
                        <!-- ★禁忌の開閉はパイル(auto-piles 内)がボタンを兼ねる。チップは退役し、
                             id はパイル側に移った(battle.js の参照は不変) -->
                        <span class="auto-chip auto-chip-plain text-muted" id="my-deck-name">-</span>
                    </div>
                    <div id="my-mana-row" class="mana-row auto-mana-row"></div>
                </div>
            </div>

            <!-- 手札。★禁忌の帯は開いたとき手札の<b>上に重なる</b>(レイアウトの高さを消費しない) -->
            <div class="auto-hand-wrap">
                <div class="small text-muted mb-1">手札(クリックで使用 / 右クリックで拡大)</div>
                <div id="my-hand" class="hand-row"></div>
                <div id="taboo-strip" class="auto-taboo-strip d-none">
                    <div class="auto-taboo-head">
                        <span class="small">禁忌デッキ(自分のみ閲覧可 / メインフェイズにマナで支払って使用)</span>
                        <button type="button" class="btn btn-sm btn-outline-light"
                                onclick="toggleTabooRow()">閉じる</button>
                    </div>
                    <div id="my-taboo" class="hand-row taboo-row"></div>
                </div>
            </div>
        </div>

        <!-- 右列(400px)。フェイズ操作・選択の問いかけ・ログ。★手動モードの右列と同じ役割分担 -->
        <div class="auto-side">
            <div id="message-area" class="alert alert-info py-2 d-none"></div>
            <div id="choose-order-area" class="d-none">
                <span class="me-2">ダイスに勝ちました。先攻/後攻を選んでください:</span>
                <button class="btn btn-warning btn-sm" onclick="chooseOrder(true)">先攻をとる</button>
                <button class="btn btn-outline-warning btn-sm" onclick="chooseOrder(false)">後攻をとる</button>
            </div>
            <div id="selection-area" class="alert alert-warning py-2 d-none">
                <span id="selection-prompt"></span>
                <button id="btn-skip-target" class="btn btn-sm btn-outline-dark ms-2 d-none"
                        onclick="skipRequirement()">選ばない</button>
                <button id="btn-confirm-target" class="btn btn-sm btn-dark ms-2 d-none"
                        onclick="confirmRequirement()">この内容で確定</button>
                <button id="btn-open-trash" class="btn btn-sm btn-outline-dark ms-2 d-none"
                        onclick="openTrashPicker()">墓地を開く</button>
                <button class="btn btn-sm btn-outline-dark ms-2" onclick="cancelSelection()">キャンセル</button>
            </div>
            <div id="reveal-area" class="alert alert-warning py-2 d-none">
                <div id="reveal-prompt" class="mb-1">選択してください</div>
                <div id="reveal-cards" class="d-flex gap-2 flex-wrap"></div>
                <button id="btn-confirm-choice" class="btn btn-sm btn-dark mt-2 d-none"
                        onclick="confirmChoice()">この内容で確定</button>
            </div>
            <div id="mulligan-area" class="alert alert-primary py-2 d-none">
                <span>マリガン: 引き直したいカードを手札からクリックで選択(<span id="mulligan-count">0</span>枚選択中)</span>
                <button class="btn btn-sm btn-warning ms-2" onclick="submitMulligan()">この内容で確定</button>
                <button class="btn btn-sm btn-outline-dark ms-2" onclick="keepHand()">引き直さない</button>
            </div>
            <div id="turn-controls" class="d-none">
                <button id="btn-next-phase" class="btn btn-primary btn-sm" onclick="nextPhase()">次のフェイズへ</button>
                <button id="btn-summon-grave" class="btn btn-outline-secondary btn-sm d-none"
                        onclick="openGraveSummon()">墓地から召喚</button>
                <button id="btn-end-turn" class="btn btn-outline-danger btn-sm" onclick="endTurn()">ターン終了</button>
            </div>
            <div id="log-area" class="log-box small rounded p-2 auto-log"></div>
        </div>
    </div>
</div>

<!-- ★Batch 42: 拡大(右クリック)。カードの効果テキストを読むための面。
     閉じるのはクリック / 右クリック / Esc のどれでもよい(battle.js) -->
<div id="auto-zoom" class="auto-zoom d-none">
    <div id="auto-zoom-card" class="auto-zoom-card"></div>
</div>

<!-- ★Batch 44: ホバープレビュー(B-1)。クリックを吸わない(pointer-events: none) -->
<div id="auto-hover" class="auto-hover d-none">
    <div id="auto-hover-card" class="auto-zoom-card"></div>
</div>

<!-- 汎用の情報モーダル(墓地・マナ・リーダー能力の一覧表示に使う) -->
<div id="info-modal" class="info-modal d-none" onclick="hideModal()">
    <div class="info-modal-body" onclick="event.stopPropagation()">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <strong id="info-modal-title"></strong>
            <button class="btn btn-sm btn-outline-light" onclick="hideModal()">閉じる</button>
        </div>
        <div id="info-modal-content" class="small"></div>
    </div>
</div>

<script th:inline="javascript">
    const ROOM_ID = /*[[${roomId}]]*/ '';
    const PLAYER_ID = /*[[${playerId}]]*/ '';
</script>
<!-- ★★Batch 41: 自前配信。これが読めないと盤面が一生来ない(設計解説 1-2) -->
<script th:src="@{/vendor/stomp-7.0.0.umd.min.js}"></script>
<script th:src="@{/js/battle.js(v=17)}"></script>
</body>
</html>
