<!DOCTYPE html>
<html lang="ja" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カード一覧 — クイン・タブーエレメント</title>
    <!-- ★Batch 33 2-3: アイコンとメタ情報。favicon が無いと全ページで
         ブラウザ既定アイコン+毎ロード404になる。theme-color と description は
         リンクを貼った先・ブックマーク・検索結果での見え方に効く -->
    <meta name="description" content="全235枚のカード一覧。カード定義(manual-cards.json)の内容をカードの形で表示します。">
    <meta name="theme-color" content="#212529">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <!-- ★Batch 41: CDN をやめて自前配信にした(理由は batch41 設計解説 1章) -->
    <link th:href="@{/vendor/bootstrap-5.3.3.min.css}" rel="stylesheet">
    <!-- ★★Batch 61: カードフェイスの見た目の正は battle.css である(裁定60・裁定130)。
         この画面のためにカードの形を書き直さない。 -->
    <link th:href="@{/css/battle.css(v=49)}" rel="stylesheet">
    <th:block th:replace="~{fragments/card-face :: styles}"></th:block>
    <style>
        /* ★Batch 61: 盤面・デッキメーカーと同じ黒地に揃えた。
           カードフェイスは黒地の上で成立する設計であり(battle.css)、
           白地に置くと縁の落ち影も光沢も意味を失う。
           色の値はロビー・盤面と同一(#212529 / #f8f9fa)である。 */
        :root { color-scheme: dark; }
        body { background-color: #212529; color: #f8f9fa; }
        .card { background-color: #2b3035; border-color: #495057; }
        .card-header { background-color: #343a40; border-bottom-color: #495057; }
        .text-muted { color: #adb5bd !important; }
    </style>
</head>
<body class="bg-dark text-light">
<div class="container-fluid py-4" style="max-width: 1500px">

    <h1 class="mb-1 h3">カード一覧(通常モード)</h1>
    <p class="text-muted mb-3">
        カード定義 <strong th:text="${totalCards}">0</strong> 枚 /
        現在の部屋数 <span th:text="${roomCount}">0</span>
        <br>
        <span class="small">
            ★見た目はデッキメーカー・盤面と同じカードフェイスである(★Batch 61)。
            キーワードは本文から読むものなので(裁定158)、別枠には出していない。
        </span>
    </p>

    <div th:each="entry : ${cardsByCivilization}" class="card mb-4">
        <div class="card-header">
            <strong th:text="${entry.key.displayName} + '文明'">文明</strong>
            <span class="badge bg-secondary" th:text="${#lists.size(entry.value)} + '枚'">0枚</span>
        </div>
        <div class="card-body">
            <div th:replace="~{fragments/card-face :: grid(${entry.value})}"></div>
        </div>
    </div>

</div>
</body>
</html>
