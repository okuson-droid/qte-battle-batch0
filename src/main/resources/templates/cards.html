<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カードマスタ確認 — クイン・タブーエレメント</title>
    <!-- ★Batch 33 2-3: アイコンとメタ情報。favicon が無いと全ページで
         ブラウザ既定アイコン+毎ロード404になる。theme-color と description は
         リンクを貼った先・ブックマーク・検索結果での見え方に効く -->
    <meta name="description" content="通常モードのカードマスタ(manual-cards.json)の内容を表示します。">
    <meta name="theme-color" content="#212529">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <!-- ★Batch 41: CDN をやめて自前配信にした(理由は batch41 設計解説 1章) -->
    <link th:href="@{/vendor/bootstrap-5.3.3.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-1">クイン・タブーエレメント</h1>
    <p class="text-muted">
        Batch 0 動作確認: カードマスタ <strong th:text="${totalCards}">0</strong> 枚を読み込み済み /
        現在の部屋数 <span th:text="${roomCount}">0</span>
    </p>

    <div th:each="entry : ${cardsByCivilization}" class="card mb-4">
        <div class="card-header">
            <strong th:text="${entry.key.displayName} + '文明'">文明</strong>
            <span class="badge bg-secondary" th:text="${#lists.size(entry.value)} + '枚'">0枚</span>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm table-striped mb-0 align-middle">
                <thead>
                <tr>
                    <th style="width: 8rem">種別</th>
                    <th style="width: 14rem">名前</th>
                    <th style="width: 4rem">Cost</th>
                    <th style="width: 4rem">Atk</th>
                    <th style="width: 4rem">HP</th>
                    <th style="width: 14rem">キーワード</th>
                    <th>テキスト</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="card : ${entry.value}">
                    <td th:text="${card.type}">MINION</td>
                    <td th:text="${card.name}">名前</td>
                    <td th:text="${card.cost}"></td>
                    <td th:text="${card.attack}"></td>
                    <td th:text="${card.hp}"></td>
                    <td>
                        <span th:each="kw : ${card.keywords}" class="badge text-bg-info me-1"
                              th:text="${kw.displayName}">速攻</span>
                    </td>
                    <td class="small" th:text="${card.text}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
